<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" fill="none">
  <defs>
    <linearGradient id="sg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D1FAE5"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <rect width="320" height="160" rx="16" fill="url(#sg)"/>
  <!-- sun -->
  <circle cx="260" cy="40" r="22" fill="url(#sun)"/>
  <g stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <line x1="260" y1="8" x2="260" y2="14"/>
    <line x1="260" y1="66" x2="260" y2="72"/>
    <line x1="228" y1="40" x2="234" y2="40"/>
    <line x1="286" y1="40" x2="292" y2="40"/>
    <line x1="237" y1="17" x2="241" y2="21"/>
    <line x1="279" y1="59" x2="283" y2="63"/>
    <line x1="237" y1="63" x2="241" y2="59"/>
    <line x1="279" y1="21" x2="283" y2="17"/>
  </g>
  <!-- solar panels -->
  <g transform="translate(30,70)">
    <rect x="0" y="20" width="90" height="50" rx="3" fill="#065F46" transform="skewX(-12)"/>
    <rect x="5" y="25" width="35" height="18" rx="1" fill="#34D399" transform="skewX(-12)" opacity="0.9"/>
    <rect x="45" y="25" width="35" height="18" rx="1" fill="#10B981" transform="skewX(-12)" opacity="0.9"/>
    <rect x="5" y="48" width="35" height="18" rx="1" fill="#10B981" transform="skewX(-12)" opacity="0.9"/>
    <rect x="45" y="48" width="35" height="18" rx="1" fill="#34D399" transform="skewX(-12)" opacity="0.9"/>
    <line x1="10" y1="70" x2="10" y2="85" stroke="#064E3B" stroke-width="3"/>
    <line x1="70" y1="70" x2="70" y2="85" stroke="#064E3B" stroke-width="3"/>
  </g>
  <!-- tree -->
  <g transform="translate(150,50)">
    <rect x="28" y="60" width="12" height="40" rx="2" fill="#92400E"/>
    <circle cx="34" cy="45" r="28" fill="#059669"/>
    <circle cx="18" cy="55" r="18" fill="#10B981"/>
    <circle cx="50" cy="55" r="18" fill="#34D399"/>
  </g>
  <!-- plant pot -->
  <g transform="translate(230,85)">
    <path d="M10 25 L15 55 Q25 60 35 55 L40 25 Z" fill="#B45309"/>
    <ellipse cx="25" cy="25" rx="18" ry="6" fill="#D97706"/>
    <path d="M20 25 Q15 5 25 0 Q35 5 30 25" fill="#16A34A"/>
